
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LipiBR Studio</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #1e1e1e;
    color: #cccccc;
    font-family: "Segoe UI", sans-serif;
    height: 100vh;
    overflow: hidden;
    font-size: 13px;
}

button {
    font-family: inherit;
    cursor: pointer;
    color: inherit;
}

.topbar {
    height: 35px;
    background: #181818;
    border-bottom: 1px solid #2b2b2b;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 13px;
    color: #cccccc;
}

.brand-symbol {
    color: #3794ff;
    font-weight: 700;
    font-size: 17px;
}

.menu {
    display: flex;
    gap: 15px;
    color: #aaaaaa;
    font-size: 12px;
}

.menu span {
    cursor: pointer;
}

.menu span:hover {
    color: white;
}

.top-actions {
    display: flex;
    gap: 6px;
}

.top-actions button {
    height: 25px;
    padding: 0 10px;
    background: #2d2d2d;
    border: 1px solid #414141;
    font-size: 12px;
}

.top-actions button:hover {
    background: #383838;
}

.top-actions .run {
    background: #007acc;
    border-color: #007acc;
    color: white;
}

.workspace {
    display: grid;
    grid-template-columns: 48px 220px minmax(300px, 1fr) minmax(260px, 34%);
    height: calc(100vh - 59px);
}

.activity-bar {
    background: #181818;
    border-right: 1px solid #303030;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.activity {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    color: #858585;
    font-size: 21px;
    border-left: 2px solid transparent;
    cursor: pointer;
}

.activity:hover {
    color: #ffffff;
}

.activity.active {
    color: #ffffff;
    border-left-color: #ffffff;
}

.explorer {
    background: #181818;
    border-right: 1px solid #303030;
    overflow-y: auto;
}

.explorer-header {
    height: 36px;
    padding: 12px 14px;
    font-size: 11px;
    letter-spacing: .7px;
    color: #bbbbbb;
}

.section-title {
    height: 29px;
    padding: 7px 10px;
    font-size: 11px;
    font-weight: 600;
    color: #cccccc;
}

.file {
    display: block;
    width: 100%;
    height: 27px;
    padding: 0 12px 0 27px;
    border: none;
    background: transparent;
    text-align: left;
    font-size: 12px;
    color: #cccccc;
}

.file:hover {
    background: #252526;
}

.file.active {
    background: #37373d;
    color: #ffffff;
}

.file-type {
    display: inline-block;
    width: 20px;
    font-weight: bold;
}

.html-type { color: #e37933; }
.css-type { color: #519aba; }
.js-type { color: #e5c07b; }

.editor-area {
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: #1e1e1e;
}

.tabs {
    height: 36px;
    flex-shrink: 0;
    display: flex;
    background: #181818;
    border-bottom: 1px solid #303030;
}

.tab {
    min-width: 125px;
    padding: 10px 14px;
    background: #1e1e1e;
    border-right: 1px solid #303030;
    border-top: 1px solid #007acc;
    font-size: 12px;
    color: #ffffff;
}

.editor {
    flex: 1;
    display: flex;
    min-height: 0;
    overflow: hidden;
}

.line-numbers {
    width: 52px;
    flex-shrink: 0;
    padding: 12px 12px 12px 0;
    text-align: right;
    color: #858585;
    font-family: Consolas, monospace;
    font-size: 13px;
    line-height: 22px;
    white-space: pre;
    overflow: hidden;
    user-select: none;
}

#codigo {
    flex: 1;
    min-width: 0;
    resize: none;
    outline: none;
    border: none;
    background: transparent;
    color: #d4d4d4;
    padding: 12px 8px;
    font-family: Consolas, monospace;
    font-size: 13px;
    line-height: 22px;
    white-space: pre;
    overflow: auto;
    tab-size: 4;
}

#codigo::selection {
    background: #264f78;
}

.panel-bottom {
    height: 165px;
    flex-shrink: 0;
    background: #181818;
    border-top: 1px solid #303030;
    display: flex;
    flex-direction: column;
}

.panel-tabs {
    height: 35px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 0 15px;
    border-bottom: 1px solid #303030;
    font-size: 11px;
}

.panel-tab {
    height: 35px;
    display: flex;
    align-items: center;
    color: #bbbbbb;
}

.panel-tab.active {
    color: #ffffff;
    border-bottom: 1px solid #007acc;
}

#saida {
    flex: 1;
    overflow: auto;
    padding: 12px 15px;
    color: #cccccc;
    font-family: Consolas, monospace;
    font-size: 12px;
    line-height: 20px;
    white-space: pre-wrap;
}

.preview {
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: #181818;
    border-left: 1px solid #303030;
}

.preview-header {
    height: 36px;
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 12px;
    border-bottom: 1px solid #303030;
    font-size: 11px;
    color: #bbbbbb;
}

.preview-header button {
    background: #2d2d2d;
    border: 1px solid #414141;
    padding: 4px 9px;
    font-size: 11px;
}

#preview {
    flex: 1;
    width: 100%;
    border: none;
    background: white;
}

.statusbar {
    height: 24px;
    background: #007acc;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    font-size: 11px;
}

.status-left, .status-right {
    display: flex;
    gap: 15px;
}

@media(max-width: 1000px) {
    .workspace {
        grid-template-columns: 42px 180px 1fr;
    }

    .preview {
        display: none;
    }
}

@media(max-width: 650px) {
    .workspace {
        grid-template-columns: 38px 1fr;
    }

    .explorer {
        display: none;
    }

    .menu {
        display: none;
    }
}
</style>
</head>

<body>

<header class="topbar">

    <div class="brand">
        <span class="brand-symbol">L</span>
        <span>LipiBR Studio</span>
    </div>

    <nav class="menu">
        <span>Arquivo</span>
        <span>Editar</span>
        <span>Seleção</span>
        <span>Exibir</span>
        <span>Executar</span>
        <span>Ajuda</span>
    </nav>

    <div class="top-actions">
        <button id="novoArquivo">Novo arquivo</button>
        <button id="salvar">Salvar</button>
        <button class="run" id="executar">Executar</button>
    </div>

</header>

<main class="workspace">

    <aside class="activity-bar">
        <div class="activity active" title="Explorador">▤</div>
        <div class="activity" title="Pesquisar">⌕</div>
        <div class="activity" title="Extensões">▦</div>
        <div class="activity" title="Configurações">⚙</div>
    </aside>

    <aside class="explorer">

        <div class="explorer-header">EXPLORADOR</div>

        <div class="section-title">▼ MEU PROJETO</div>

        <div id="arquivos">

            <button class="file active" data-arquivo="pagina.lhtml">
                <span class="file-type html-type">◇</span> pagina.lhtml
            </button>

            <button class="file" data-arquivo="estilo.lcss">
                <span class="file-type css-type">◇</span> estilo.lcss
            </button>

            <button class="file" data-arquivo="codigo.ljs">
                <span class="file-type js-type">◇</span> codigo.ljs
            </button>

        </div>

    </aside>

    <section class="editor-area">

        <div class="tabs">
            <div class="tab" id="abaAtual">pagina.lhtml</div>
        </div>

        <div class="editor">

            <div class="line-numbers" id="numeros">1</div>

            <textarea
                id="codigo"
                spellcheck="false"
                autocomplete="off"
                autocapitalize="off"
            ></textarea>

        </div>

        <section class="panel-bottom">

            <div class="panel-tabs">
                <span class="panel-tab active">TERMINAL</span>
                <span class="panel-tab">SAÍDA</span>
                <span class="panel-tab">PROBLEMAS</span>
            </div>

            <pre id="saida">LipiBR Studio iniciado.
Pronto.</pre>

        </section>

    </section>

    <section class="preview">

        <div class="preview-header">
            <span>PRÉ-VISUALIZAÇÃO</span>
            <button id="atualizar">Atualizar</button>
        </div>

        <iframe id="preview" sandbox="allow-scripts"></iframe>

    </section>

</main>

<footer class="statusbar">
    <div class="status-left">
        <span>LipiBR</span>
        <span>Projeto</span>
    </div>

    <div class="status-right">
        <span>UTF-8</span>
        <span>Espaços: 4</span>
        <span>Pronto</span>
    </div>
</footer>

<script src="motor.js"></script>
<script src="studio.js"></script>

</body>
</html>
