<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LipiBR Studio</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #1e1e1e;
    color: #cccccc;
    font-family: Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
}

.topbar {
    height: 48px;
    background: #181818;
    border-bottom: 1px solid #303030;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
}

.logo {
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .3px;
}

.logo span {
    color: #3794ff;
}

.actions {
    display: flex;
    gap: 8px;
}

button {
    background: #2d2d2d;
    color: #cccccc;
    border: 1px solid #414141;
    padding: 7px 12px;
    cursor: pointer;
    font-size: 12px;
}

button:hover {
    background: #3a3a3a;
}

button.primary {
    background: #0e639c;
    border-color: #1177bb;
    color: white;
}

button.primary:hover {
    background: #1177bb;
}

.workspace {
    height: calc(100vh - 48px);
    display: grid;
    grid-template-columns: 230px 1fr;
}

.sidebar {
    background: #181818;
    border-right: 1px solid #303030;
    overflow-y: auto;
}

.sidebar-title {
    padding: 18px 15px 12px;
    font-size: 11px;
    font-weight: bold;
    color: #bbbbbb;
    letter-spacing: 1px;
}

.file-actions {
    display: flex;
    gap: 5px;
    padding: 0 10px 12px;
}

.file-actions button {
    flex: 1;
    padding: 7px 4px;
}

.file {
    padding: 8px 15px;
    font-size: 13px;
    cursor: pointer;
    border-left: 2px solid transparent;
}

.file:hover {
    background: #252526;
}

.file.active {
    background: #37373d;
    border-left-color: #3794ff;
    color: white;
}

.main {
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.tabs {
    height: 38px;
    background: #181818;
    display: flex;
    border-bottom: 1px solid #303030;
    overflow-x: auto;
}

.tab {
    min-width: 110px;
    max-width: 180px;
    padding: 11px 14px;
    font-size: 12px;
    cursor: pointer;
    border-right: 1px solid #303030;
    white-space: nowrap;
}

.tab.active {
    background: #1e1e1e;
    color: white;
    border-top: 1px solid #3794ff;
}

.editor-area {
    flex: 1;
    min-height: 0;
    position: relative;
}

#editor {
    width: 100%;
    height: 100%;
}

.bottom {
    height: 190px;
    background: #181818;
    border-top: 1px solid #303030;
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 100px;
}

.panel {
    min-width: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

.panel + .panel {
    border-left: 1px solid #303030;
}

.panel-title {
    height: 32px;
    padding: 10px 13px;
    font-size: 11px;
    color: #bbbbbb;
    border-bottom: 1px solid #303030;
}

#terminal {
    padding: 10px;
    overflow: auto;
    font-family: Consolas, monospace;
    font-size: 12px;
    color: #9cdcfe;
    white-space: pre-wrap;
}

#preview {
    width: 100%;
    height: 100%;
    background: white;
    border: 0;
}

.statusbar {
    height: 22px;
    background: #007acc;
    color: white;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
}

@media (max-width: 700px) {
    .workspace {
        grid-template-columns: 150px 1fr;
    }

    .bottom {
        grid-template-columns: 1fr;
        height: 240px;
    }

    .bottom .panel:first-child {
        display: none;
    }

    .actions button {
        padding: 6px;
    }
}
</style>
</head>

<body>

<header class="topbar">
    <div class="logo">Lipi<span>BR</span> Studio</div>

    <div class="actions">
        <button id="saveFiles">Salvar</button>
        <button id="runProject" class="primary">Executar</button>
    </div>
</header>

<div class="workspace">

    <aside class="sidebar">
        <div class="sidebar-title">EXPLORADOR</div>

        <div class="file-actions">
            <button id="newFile">Novo arquivo</button>
        </div>

        <div id="fileList"></div>
    </aside>

    <main class="main">

        <div id="tabs" class="tabs"></div>

        <div class="editor-area">
            <div id="editor"></div>
        </div>

        <div class="bottom">

            <section class="panel">
                <div class="panel-title">SAÍDA</div>
                <pre id="terminal">LipiBR Studio iniciado.</pre>
            </section>

            <section class="panel">
                <div class="panel-title">PRÉ-VISUALIZAÇÃO</div>
                <iframe id="preview" title="Pré-visualização"></iframe>
            </section>

        </div>

    </main>

</div>

<footer class="statusbar">
    <span id="statusText">LipiBR — pronto</span>
    <span id="fileType">LipiHTML</span>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
<script src="motor.js"></script>
<script src="studio.js"></script>

</body>
</html>
