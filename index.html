<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LipiBR Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topo">
        <div class="marca">
            <span class="logo">L</span>
            <span>LipiBR Studio</span>
        </div>

        <div class="acoes">
            <button id="novoArquivo">Novo arquivo</button>
            <button id="executar">▶ Executar</button>
            <button id="salvar">Salvar</button>
        </div>
    </header>

    <main class="interface">
        <aside class="explorador">
            <h3>EXPLORADOR</h3>
            <div class="pasta">📁 MEU PROJETO</div>

            <div id="arquivos">
                <button class="arquivo ativo" data-arquivo="pagina.lhtml">🌐 pagina.lhtml</button>
                <button class="arquivo" data-arquivo="estilo.lcss">🎨 estilo.lcss</button>
                <button class="arquivo" data-arquivo="codigo.ljs">JS codigo.ljs</button>
            </div>
        </aside>

        <section class="editor-area">
            <div class="abas" id="abas">
                <div class="aba ativa">pagina.lhtml</div>
            </div>

            <div class="editor">
                <div class="numeros" id="numeros">1</div>
                <textarea id="codigo" spellcheck="false"></textarea>
            </div>

            <div class="terminal">
                <div class="terminal-titulo">TERMINAL</div>
                <pre id="saida">LipiBR Studio iniciado.</pre>
            </div>
        </section>

        <section class="visualizacao">
            <div class="preview-titulo">
                <span>PRÉ-VISUALIZAÇÃO</span>
                <button id="atualizar">↻ Atualizar</button>
            </div>
            <iframe id="preview" sandbox="allow-scripts"></iframe>
        </section>
    </main>

    <script src="motor.js"></script>
    <script src="studio.js"></script>
</body>
</html>
