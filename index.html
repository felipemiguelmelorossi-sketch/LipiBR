<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LipiBR Studio</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #1e1e1e;
    color: #cccccc;
    font-family: Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
}

.topbar {
    height: 48px;
    background: #181818;
    border-bottom: 1px solid #303030;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
}

.logo {
    color: #fff;
    font-size: 15px;
    font-weight: 600;
}

.logo span {
    color: #3794ff;
}

.actions {
    display: flex;
    gap: 8px;
}

button {
    background: #2d2d2d;
    color: #ccc;
    border: 1px solid #414141;
    padding: 7px 12px;
    cursor: pointer;
    font-size: 12px;
}

button:hover {
    background: #3a3a3a;
}

.primary {
    background: #0e639c;
    color: white;
    border-color: #1177bb;
}

.workspace {
    height: calc(100vh - 70px);
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr);
}

.sidebar {
    background: #181818;
    border-right: 1px solid #303030;
    overflow-y: auto;
}

.sidebar-title {
    padding: 18px 14px 12px;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1px;
}

.file-actions {
    padding: 0 10px 12px;
}

.file-actions button {
    width: 100%;
}

.file {
    padding: 9px 14px;
    font-size: 13px;
    cursor: pointer;
    border-left: 2px solid transparent;
}

.file:hover {
    background: #252526;
}

.file.active {
    background: #37373d;
    border-left-color: #3794ff;
    color: white;
}

.main {
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.tabs {
    height: 38px;
    flex-shrink: 0;
    background: #181818;
    display: flex;
    border-bottom: 1px solid #303030;
}

.tab {
    padding: 11px 16px;
    font-size: 12px;
    cursor: pointer;
    border-right: 1px solid #303030;
}

.tab.active {
    background: #1e1e1e;
    color: white;
    border-top: 1px solid #3794ff;
}

.split {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
}

.editor-panel,
.preview-panel {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
}

.editor-panel {
    border-right: 1px solid #303030;
}

.panel-title {
    height: 32px;
    flex-shrink: 0;
    padding: 10px 13px;
    font-size: 11px;
    color: #bbbbbb;
    background: #181818;
    border-bottom: 1px solid #303030;
}

#editor {
    flex: 1;
    min-height: 0;
    width: 100%;
}

#preview {
    flex: 1;
    min-height: 0;
    width: 100%;
    border: 0;
    background: white;
}

.terminal {
    height: 105px;
    flex-shrink: 0;
    background: #181818;
    border-top: 1px solid #303030;
    display: flex;
    flex-direction: column;
}

#terminal {
    padding: 9px 12px;
    overflow: auto;
    white-space: pre-wrap;
    font-family: Consolas, monospace;
    font-size: 12px;
    color: #9cdcfe;
}

.statusbar {
    height: 22px;
    background: #007acc;
    color: white;
    font-size: 11px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 10px;
}

@media (max-width: 800px) {
    .workspace {
        grid-template-columns: 145px minmax(0, 1fr);
    }

    .split {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: 1fr 1fr;
    }

    .editor-panel {
        border-right: 0;
        border-bottom: 1px solid #303030;
    }
}
</style>
</head>

<body>

<header class="topbar">
    <div class="logo">Lipi<span>BR</span> Studio</div>

    <div class="actions">
        <button id="saveFiles">Salvar</button>
        <button id="runProject" class="primary">Executar</button>
    </div>
</header>

<div class="workspace">

    <aside class="sidebar">
        <div class="sidebar-title">EXPLORADOR</div>

        <div class="file-actions">
            <button id="newFile">Novo arquivo .lp</button>
        </div>

        <div id="fileList"></div>
    </aside>

    <main class="main">
        <div id="tabs" class="tabs"></div>

        <div class="split">

            <section class="editor-panel">
                <div class="panel-title">EDITOR — LIPIBR</div>
                <div id="editor"></div>
            </section>

            <section class="preview-panel">
                <div class="panel-title">PRÉ-VISUALIZAÇÃO</div>
                <iframe id="preview" title="Pré-visualização"></iframe>
            </section>

        </div>

        <section class="terminal">
            <div class="panel-title">SAÍDA</div>
            <pre id="terminal">LipiBR Studio iniciado.</pre>
        </section>
    </main>

</div>

<footer class="statusbar">
    <span id="statusText">LipiBR — pronto</span>
    <span>.lp</span>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
<script src="motor.js"></script>
<script src="studio.js"></script>

</body>
</html>
