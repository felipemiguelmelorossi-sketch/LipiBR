
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LipiBR Studio</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{height:100vh;overflow:hidden;background:#1e1e1e;color:#ccc;font:13px "Segoe UI",Arial,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
.topbar{height:35px;background:#181818;border-bottom:1px solid #303030;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;color:#eee}
.brand-mark{color:#3794ff;font-size:17px;font-weight:700}
.menu{display:flex;gap:15px;color:#aaa}
.menu span{cursor:pointer}
.menu span:hover{color:#fff}
.actions{display:flex;gap:6px}
.actions button{background:#2d2d2d;border:1px solid #414141;padding:4px 10px;font-size:12px}
.actions button:hover{background:#3a3a3a}
.actions .run{background:#0e639c;border-color:#0e639c;color:white}
.workspace{height:calc(100vh - 59px);display:grid;grid-template-columns:48px 220px minmax(300px,1fr) minmax(250px,34%)}
.activity{background:#181818;border-right:1px solid #303030;display:flex;flex-direction:column;align-items:center}
.activity button{width:47px;height:48px;background:none;border:0;border-left:2px solid transparent;color:#858585;font-size:19px}
.activity button.active{border-left-color:#fff;color:#fff}
.activity button:hover{color:#fff}
.explorer{background:#181818;border-right:1px solid #303030;overflow:auto}
.explorer-title{height:36px;padding:12px 14px;font-size:11px;letter-spacing:.7px}
.project-title{height:29px;padding:7px 10px;font-size:11px;font-weight:600}
.file-list{padding-bottom:10px}
.file{width:100%;height:27px;padding:0 8px 0 25px;text-align:left;background:none;border:0;font-size:12px}
.file:hover{background:#252526}
.file.active{background:#37373d;color:#fff}
.file-icon{display:inline-block;width:19px;font-weight:bold}
.html-icon{color:#e37933}.css-icon{color:#519aba}.js-icon{color:#e5c07b}.lipi-icon{color:#b180d7}
.explorer-actions{display:flex;gap:5px;padding:9px;border-top:1px solid #303030}
.explorer-actions button{background:#252526;border:1px solid #414141;padding:5px 7px;font-size:11px}
.editor-area{min-width:0;display:flex;flex-direction:column}
.tabs{height:36px;display:flex;overflow-x:auto;background:#181818;border-bottom:1px solid #303030}
.tab{height:36px;min-width:115px;padding:10px 13px;background:#1e1e1e;border:0;border-right:1px solid #303030;border-top:1px solid #007acc;text-align:left;white-space:nowrap;font-size:12px}
.tab:not(.active){background:#2d2d2d;color:#999;border-top-color:transparent}
.editor-wrap{flex:1;min-height:0;position:relative}
#editor{position:absolute;inset:0}
#welcome{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#777}
.bottom-panel{height:165px;flex-shrink:0;background:#181818;border-top:1px solid #303030;display:flex;flex-direction:column}
.panel-tabs{height:35px;display:flex;align-items:center;gap:22px;padding:0 15px;border-bottom:1px solid #303030;font-size:11px}
.panel-tabs span{height:35px;display:flex;align-items:center}
.panel-tabs .selected{color:#fff;border-bottom:1px solid #007acc}
#output{flex:1;overflow:auto;padding:12px 15px;color:#ccc;font:12px/20px Consolas,monospace;white-space:pre-wrap}
.preview{min-width:0;display:flex;flex-direction:column;background:#181818;border-left:1px solid #303030}
.preview-head{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #303030;font-size:11px}
.preview-head button{background:#2d2d2d;border:1px solid #414141;padding:4px 9px;font-size:11px}
#preview{flex:1;width:100%;border:0;background:white}
.status{height:24px;background:#007acc;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:11px}
@media(max-width:950px){.workspace{grid-template-columns:42px 180px 1fr}.preview{display:none}}
@media(max-width:650px){.workspace{grid-template-columns:38px 1fr}.explorer{display:none}.menu{display:none}}
</style>
</head>

<body>
<header class="topbar">
    <div class="brand"><span class="brand-mark">L</span><span>LipiBR Studio</span></div>
    <nav class="menu">
        <span>Arquivo</span><span>Editar</span><span>Exibir</span><span>Executar</span><span>Ajuda</span>
    </nav>
    <div class="actions">
        <button id="newFile">Novo arquivo</button>
        <button id="saveFiles">Salvar</button>
        <button class="run" id="runProject">Executar</button>
    </div>
</header>

<main class="workspace">
    <aside class="activity">
        <button class="active" title="Explorador">▤</button>
        <button title="Pesquisar">⌕</button>
        <button title="Extensões">▦</button>
    </aside>

    <aside class="explorer">
        <div class="explorer-title">EXPLORADOR</div>
        <div class="project-title">▼ MEU PROJETO</div>
        <div class="file-list" id="fileList"></div>
        <div class="explorer-actions">
            <button id="newFolder">Nova pasta</button>
            <button id="renameFile">Renomear</button>
            <button id="deleteFile">Excluir</button>
        </div>
    </aside>

    <section class="editor-area">
        <div class="tabs" id="tabs"></div>
        <div class="editor-wrap">
            <div id="editor"></div>
            <div id="welcome">Selecione um arquivo para começar.</div>
        </div>
        <section class="bottom-panel">
            <div class="panel-tabs">
                <span class="selected">TERMINAL</span>
                <span>SAÍDA</span>
                <span>PROBLEMAS</span>
            </div>
            <pre id="output">LipiBR Studio iniciado.
Selecione um arquivo e comece a programar.</pre>
        </section>
    </section>

    <section class="preview">
        <div class="preview-head">
            <span>PRÉ-VISUALIZAÇÃO</span>
            <button id="refreshPreview">Atualizar</button>
        </div>
        <iframe id="preview" sandbox="allow-scripts"></iframe>
    </section>
</main>

<footer class="status">
    <span>LipiBR</span>
    <span id="statusText">Pronto | UTF-8 | Espaços: 4</span>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
<script src="motor.js"></script>
<script src="studio.js"></script>
</body>
</html>
